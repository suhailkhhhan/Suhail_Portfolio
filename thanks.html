<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Suhail Khan</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body{
            background:linear-gradient(135deg,#0f172a,#111827);
            font-family:Poppins,sans-serif;
        }

        .check{
            animation:pop .6s ease;
        }

        @keyframes pop{
            0%{transform:scale(0);}
            80%{transform:scale(1.15);}
            100%{transform:scale(1);}
        }
    </style>

</head>

<body class="flex items-center justify-center min-h-screen">

<div class="bg-gray-900 border border-emerald-500 rounded-2xl shadow-2xl p-10 max-w-lg text-center">

    <div class="check text-7xl mb-6">
        ✅
    </div>

    <h1 class="text-4xl font-bold text-white mb-4">
        Message Sent Successfully!
    </h1>

    <p class="text-gray-300 mb-8 leading-relaxed">
        Thank you for contacting me.<br>
        I have received your message and will get back to you as soon as possible.
    </p>

    <a href="index.html"
       class="inline-block px-8 py-3 rounded-lg bg-emerald-500 text-white font-semibold hover:bg-emerald-600 transition">
        ← Back to Portfolio
    </a>

</div>

</body>
</html>
